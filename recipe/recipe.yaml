schema_version: 1

context:
  version: 2.2.0

recipe:
  name: libhdbpp-split
  version: ${{ version }}

source:
  url: https://gitlab.com/tango-controls/hdbpp/libhdbpp/-/archive/${{ version }}/libhdbpp-${{ version }}.tar.gz
  sha256: 0b43f8ca9c57a8aff23fcdf6b8180f266b8968daf7fbd12bbeb1f45e27d4f82c
  patches:
    - find-tango.patch

build:
  number: 3
  skip: win

outputs:
  - staging:
      name: libhdbpp-build
    requirements:
      ignore_run_exports:
        from_package:
          - libhdbpp
      build:
        - cmake
        - ninja
        - if: unix
          then:
            - pkg-config
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
      host:
        - cppzmq
        - cpptango
        - omniorb-libs
    build:
      script:
        env:
          LIBHDBPP_VERSION: ${{ version }}
        file: build

  - package:
      name: libhdbpp
    inherit: libhdbpp-build
    build:
      files:
        - if: linux
          then:
            - lib/libhdb++.so
            - lib/libhdb++.so.2
            - lib/libhdb++.so.${{ version }}
        - if: osx
          then:
            - lib/libhdb++*.dylib
        - if: unix
          then:
            - lib/cmake/libhdbpp/**
            - include/hdb++/**
    requirements:
      run_exports:
        - ${{ pin_subpackage('libhdbpp', upper_bound='x.x') }}
      # Library doesn't link against cpptango (only headers used)
      ignore_run_exports:
        from_package:
          - cpptango
    tests:
      - package_contents:
          lib:
            - hdb++
          include:
            - hdb++/AbstractDB.h
          files:
            - if: unix
              then:
                - lib/cmake/libhdbpp/libhdbppConfig.cmake

  - package:
      name: libhdbpp-dbg
    inherit:
      from: libhdbpp-build
      run_exports: false
    build:
      skip:
        - not linux
      dynamic_linking:
        # Prevent dbg file to be modified
        # Will raise CRC mismatch otherwise!
        binary_relocation: false
      files:
        - lib/libhdb++.so.${{ version }}.dbg
    requirements:
      run:
        - ${{ pin_subpackage('libhdbpp', exact=True) }}
    tests:
      - package_contents:
          files:
            - lib/libhdb++.so.${{ version }}.dbg

about:
  license: LGPL-3.0-or-later
  license_file: LICENSE
  summary: Interface library for HDB++ archiving system.
  description: |
    HDB++ is an archiving system for Tango-Controls.
    libhdbpp provides an abstract means to archive data events to a Cassandra database,
    MySQL database, or potentially other database backends.
  homepage: https://www.tango-controls.org
  repository: https://gitlab.com/tango-controls/hdbpp/libhdbpp
  documentation: https://tango-controls.readthedocs.io/en/latest/Explanation/archiving/hdbpp.html

extra:
  feedstock-name: libhdbpp
  recipe-maintainers:
    - beenje
